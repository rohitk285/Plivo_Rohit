services:
  plivo-ivr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plivo-ivr-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - PLIVO_AUTH_ID=${PLIVO_AUTH_ID:-MAMTAWMGI0MZCTNTYZZS}
      - PLIVO_AUTH_TOKEN=${PLIVO_AUTH_TOKEN:-NDc4YTBiMTQtM2E1MS00ZDBlLWI3YjgtNjQ3NDUw}
      - PLIVO_NUMBER=${PLIVO_NUMBER:-+918035454161}
      - LIVE_ASSOCIATE_NUMBER=${LIVE_ASSOCIATE_NUMBER:-02264236412}
      - HARDCODED_OTP=${HARDCODED_OTP:-1503}
      - AUDIO_URL=${AUDIO_URL:-https://s3.amazonaws.com/plivocloud/Trumpet.mp3}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
